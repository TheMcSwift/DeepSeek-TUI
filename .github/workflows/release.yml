name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # OIDC: lets npm exchange a GitHub Actions identity for publish rights
  # (trusted publisher configured on npmjs.com) and signs provenance.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Same sibling layout as CI: devDependencies link into ../deepseek-harness.
      - uses: actions/checkout@v4
        with:
          path: tui
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: deepseek-harness
          ref: master
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      # 注意：不要给 setup-node 传 registry-url——authutil 会往 npmrc 注入
      # NODE_AUTH_TOKEN 占位符（XXXXX-...），npm 误以为已有 token 而跳过
      # GHA OIDC 交换，导致 PUT 404 "not in this registry"。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tui/pnpm-lock.yaml
      - name: Install harness deps
        working-directory: deepseek-harness
        run: pnpm install
      - name: Build harness host (types + runtime bundles)
        working-directory: deepseek-harness
        run: pnpm run build:lib:host
      - name: Install
        working-directory: tui
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: tui
        run: pnpm typecheck
      - name: Unit tests
        working-directory: tui
        run: pnpm test
      - name: Build
        working-directory: tui
        run: pnpm build
      - name: Verify tag matches version
        working-directory: tui
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version ${VERSION}"
            exit 1
          fi
      - name: Publish
        working-directory: tui
        # Trusted publishing (OIDC): 无 token 时 npm ≥ 11.5 会在 GHA 环境自动
        # 用 id-token 交换发布令牌；Node 22 自带 npm 10 无此能力，故用最新 npm。
        run: npx -y npm@latest publish --provenance --access public
